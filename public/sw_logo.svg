  <path d="M 100 55 C 108 75, 128 88, 142 115 C 128 108, 114 115, 100 140 C 86 115, 72 108, 58 115 C 72 88, 92 75, 100 55 Z" fill="#05070E"/>
  <!-- Center Core Flare -->
  <path d="M 100 70 C 104 88, 115 98, 125 118 C 112 112, 100 135, 100 135 C 100 135, 88 112, 75 118 C 85 98, 96 88, 100 70 Z" fill="#00E5FF"/>
  <circle cx="100" cy="162" r="6" fill="#00E5FF" filter="url(#swGlow)"/>
