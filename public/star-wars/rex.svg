<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="rbg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#05070E" stop-opacity="0.95"/>
    </radialGradient>
    <filter id="rglow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="24" fill="url(#rbg)" stroke="#3B82F6" stroke-width="2"/>
  <!-- Clone Helmet -->
  <path d="M65 95 C 65 50, 135 50, 135 95 L 130 120 L 70 120 Z" fill="#3B82F6" fill-opacity="0.25" stroke="#3B82F6" stroke-width="2"/>
  <!-- T-Visor -->
  <path d="M78 85 L 122 85 L 105 110 L 95 110 Z" fill="#05070E" stroke="#00E5FF" stroke-width="1.5" filter="url(#rglow)"/>
  <!-- Jaig Eyes -->
  <polygon points="80,65 90,55 85,70" fill="#3B82F6"/>
  <polygon points="120,65 110,55 115,70" fill="#3B82F6"/>
  <text x="100" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#3B82F6" letter-spacing="2">CAPTAIN REX</text>
</svg>
