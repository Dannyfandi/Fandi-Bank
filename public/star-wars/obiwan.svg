<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="obg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB800" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#05070E" stop-opacity="0.95"/>
    </radialGradient>
    <filter id="oglow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="24" fill="url(#obg)" stroke="#FFB800" stroke-width="2"/>
  <!-- Hood / Robe -->
  <path d="M55 140 C 55 60, 145 60, 145 140 L 135 165 L 65 165 Z" fill="#FFB800" fill-opacity="0.2" stroke="#FFB800" stroke-width="2"/>
  <circle cx="100" cy="90" r="20" fill="#05070E" stroke="#FFB800" stroke-width="1.5"/>
  <!-- Blue Saber -->
  <line x1="145" y1="140" x2="168" y2="40" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" filter="url(#oglow)"/>
  <text x="100" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#FFB800" letter-spacing="2">OBI-WAN KENOBI</text>
</svg>
