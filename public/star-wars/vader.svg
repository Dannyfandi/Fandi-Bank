<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="vbg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF1E56" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#05070E" stop-opacity="0.95"/>
    </radialGradient>
    <filter id="vglow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="24" fill="url(#vbg)" stroke="#FF1E56" stroke-width="2"/>
  <!-- Helmet Dome -->
  <path d="M60 85 C 60 40, 140 40, 140 85 C 150 95, 145 105, 135 105 L 65 105 C 55 105, 50 95, 60 85 Z" fill="#FF1E56" fill-opacity="0.2" stroke="#FF1E56" stroke-width="2"/>
  <!-- Mask details -->
  <circle cx="85" cy="80" r="7" fill="#05070E" stroke="#FF1E56" stroke-width="1.5"/>
  <circle cx="115" cy="80" r="7" fill="#05070E" stroke="#FF1E56" stroke-width="1.5"/>
  <polygon points="100,88 92,102 108,102" fill="#FF1E56" fill-opacity="0.4" stroke="#FF1E56" stroke-width="1.5"/>
  <!-- Crimson Saber -->
  <line x1="50" y1="150" x2="30" y2="45" stroke="#FF1E56" stroke-width="4" stroke-linecap="round" filter="url(#vglow)"/>
  <text x="100" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#FF1E56" letter-spacing="2">DARTH VADER</text>
</svg>
