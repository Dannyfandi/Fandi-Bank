  <rect width="200" height="200" rx="24" fill="url(#bg)" stroke="#00FF66" stroke-width="2"/>
  <circle cx="100" cy="70" r="28" fill="#00FF66" fill-opacity="0.25" stroke="#00FF66" stroke-width="2" filter="url(#glow)"/>
