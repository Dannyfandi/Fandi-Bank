<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="abg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#05070E" stop-opacity="0.95"/>
    </radialGradient>
    <filter id="aglow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="24" fill="url(#abg)" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Montrals / Lekku -->
  <path d="M70 40 C 60 70, 65 110, 75 130 C 85 100, 85 60, 95 40 Z" fill="#00E5FF" fill-opacity="0.4" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M130 40 C 140 70, 135 110, 125 130 C 115 100, 115 60, 105 40 Z" fill="#00E5FF" fill-opacity="0.4" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="100" cy="80" r="20" fill="#FFFFFF" fill-opacity="0.25" stroke="#FFFFFF" stroke-width="2" filter="url(#aglow)"/>
  <!-- Dual Sabers -->
  <line x1="45" y1="150" x2="25" y2="60" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" filter="url(#aglow)"/>
  <line x1="155" y1="150" x2="175" y2="60" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" filter="url(#aglow)"/>
  <text x="100" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" letter-spacing="2">AHSOKA TANO</text>
</svg>
